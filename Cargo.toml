[package]
name = "swiftvoice"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "Fast, private, offline voice typing for Windows (Parakeet TDT via ONNX Runtime, whisper.cpp fallback)"
readme = "README.md"
default-run = "swiftvoice"
build = "build.rs"

[features]
default = []
# whisper.cpp fallback engine (Bengali and ~99 other languages), opt-in via
# `--features whisper` (scripts\build-windows.ps1 adds it unless -NoWhisper).
# Needs CMake and a C++ compiler at build time; see README "Building".
whisper = ["dep:whisper-rs"]

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
crossbeam-channel = "0.5.17"
hound = "3.5.1"
lexopt = "0.3.2"
log = "0.4.34"
nnnoiseless = { version = "0.5.2", default-features = false }
# ONNX Runtime is loaded at run time from onnxruntime.dll next to the executable
# (Microsoft's official 1.31.0 build), so the app shell starts without it and
# fails with a clear message if it is missing.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-22"] }
realfft = "3.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.7"
sha2 = "0.10.9"
tar = { version = "0.4.46", default-features = false }
toml = "1.1.8"
toml_edit = "0.25.17"
whisper-rs = { version = "0.16.0", optional = true }

[target.'cfg(windows)'.dependencies]
cpal = "0.18.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[profile.dev.package."*"]
# Keep dependencies (resampler, FFT, model I/O) fast in debug builds.
opt-level = 2
