name: Release

# A version tag (git tag v0.1.0 && git push origin v0.1.0) builds the Windows
# package and attaches it to a GitHub release, which is where the README's
# "From a release zip" instructions point. The job reuses the CI build script,
# so the release runs the tests and the packaged-exe smoke test before
# anything is published. Third-party actions are pinned to full commit SHAs
# (tag in the comment) like in ci.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal -c clippy -c rustfmt
          rustc --version
          cargo --version
      - name: Tag matches the crate version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match the Cargo.toml version $version" }
          if (-not (Test-Path "docs/releases/$version.md")) { throw "release notes for $version are missing" }
      - name: Format and lint
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets --locked --features whisper -- -D warnings
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          # Also attach the bare program: updating an existing install is
          # copying this single file over SwiftVoice\swiftvoice.exe.
          $exe = Copy-Item dist/SwiftVoice/swiftvoice.exe "dist/SwiftVoice-$($env:GITHUB_REF_NAME.TrimStart('v'))-win-x64.exe" -PassThru
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $releaseArgs = @($env:GITHUB_REF_NAME, $zip.FullName, $exe.FullName, "$($zip.FullName).sha256", '--title', $env:GITHUB_REF_NAME, '--verify-tag', '--notes-file', "docs/releases/$version.md")
          if ($version.Contains('-')) { $releaseArgs += @('--prerelease', '--latest=false') }
          gh release create @releaseArgs
